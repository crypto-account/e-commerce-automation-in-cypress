version: 2.1
orbs:
  cypress: cypress-io/cypress@6
workflows:
  build:
    jobs:
      - cypress/run:
          # Musimy wskazać executor, który ma zainstalowane przeglądarki
          executor: cypress/base-18-16-1-chrome-114-ff-113-edge-114
          browser: chrome
          # Jeśli Twoja aplikacja nie musi startować lokalnie, 
          # możesz zostawić start-command zakomentowany.
          # start-command: 'npm run start'